name: CI devops 2025

# Conditions de déclenchement : sur un push vers les branches main et develop, ou sur une pull request
on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  # ============================================================
  # Job 1 : Compilation, tests backend et analyse de la qualité du code avec SonarCloud
  # ============================================================
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # 1. Récupération du code source depuis le dépôt GitHub
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # SonarCloud a besoin de l'historique Git complet pour ses analyses (blame, etc.)
          fetch-depth: 0

      # 2. Installation de la version 21 du JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Compilation, exécution des tests et analyse SonarCloud
      #    - sonar.projectKey et sonar.organization permettent de cibler le bon projet
      #    - sonar.token est lu de manière sécurisée depuis les GitHub Secrets
      - name: Build, test and analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=liuyao0010-debug_tp-devops-correction-docker
          -Dsonar.organization=liuyao0010-debug
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${SONAR_TOKEN}
          --file ./simple-api/pom.xml

  # ============================================================
  # Job 2 : Construction et publication des images Docker sur Docker Hub
  # ============================================================
  build-and-push-docker-image:
    # Dépendance : ce job ne s'exécute que si le job 'test-backend' réussit
    needs: test-backend

    runs-on: ubuntu-24.04

    steps:
      # 1. Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Authentification sur Docker Hub
      #    Utilisation des identifiants stockés dans les GitHub Secrets pour éviter tout mot de passe en clair
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # 3. Construction et push de l'image backend (simple-api)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          # Ne push l'image que si on est sur la branche main
          push: ${{ github.ref == 'refs/heads/main' }}

      # 4. Construction et push de l'image de la base de données
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # 5. Construction et push de l'image du serveur HTTP (http-server)
      - name: Build image and push http-server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-http-server:latest
          push: ${{ github.ref == 'refs/heads/main' }}
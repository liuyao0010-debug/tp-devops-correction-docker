name: CI devops 2025

# 触发条件：main 和 develop 分支 push 时运行，任何 PR 也运行
on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  # ============================================================
  # Job 1: 构建并测试后端 + SonarCloud 代码质量分析
  # ============================================================
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # 1. 检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        # SonarCloud 需要完整的 git 历史来做 blame 和增量分析
        with:
          fetch-depth: 0

      # 2. 安装 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # --- 探针步骤：检查 Token 是否成功传入 ---
      - name: Check SONAR_TOKEN presence
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "ERROR: SONAR_TOKEN is empty! Secret not configured properly."
            exit 1
          else
            echo "SUCCESS: SONAR_TOKEN is present."
          fi

      # 3. 用 Maven 构建并跑测试，同时执行 SonarCloud 分析
      - name: Build, test and analyze with SonarCloud
        # 使用 env 传参，避免长命令拼接出错
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.projectKey=liuyao0010-debug_tp-devops-correction-docker
          -Dsonar.organization=liuyao0010-debug
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${SONAR_TOKEN}
          --file ./simple-api/pom.xml

  # ============================================================
  # Job 2: 构建并推送 Docker 镜像到 Docker Hub
  # ============================================================
  build-and-push-docker-image:
    # 关键：只有 test-backend 成功后才执行本 job
    needs: test-backend

    runs-on: ubuntu-24.04

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 登录 Docker Hub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # 3. 构建并推送 backend 镜像（simple-api）
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # 4. 构建并推送 database 镜像
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # 5. 构建并推送 http-server 镜像
      - name: Build image and push http-server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-http-server:latest
          push: ${{ github.ref == 'refs/heads/main' }}